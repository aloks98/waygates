<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Waygates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .gradient-text {
            background: linear-gradient(135deg, #38bdf8 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center font-sans antialiased">
    <!-- Background -->
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-sky-500/5 rounded-full blur-3xl"></div>

    <div class="relative z-10 text-center px-6">
        <!-- Icon -->
        <div class="mb-8 flex items-center justify-center">
            <div class="w-20 h-20 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center">
                <i data-lucide="unplug" class="w-9 h-9 text-sky-400"></i>
            </div>
        </div>

        <!-- 404 -->
        <h1 class="text-8xl md:text-9xl font-black leading-none gradient-text tracking-tight">
            404
        </h1>

        <!-- Message -->
        <p class="text-lg text-slate-400 mt-4 font-medium">
            This gateway leads nowhere... yet.
        </p>

        <!-- Brand -->
        <div class="mt-16">
            <div class="inline-flex items-center gap-2 text-slate-600">
                <span class="text-xs font-semibold tracking-widest uppercase">Waygates</span>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
