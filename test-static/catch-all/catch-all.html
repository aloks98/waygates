<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catch-all Page</title>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; text-align: center; margin-top: 50px; }
        h1 { color: #4a4a4a; }
        p { color: #6a6a6a; }
        code { background-color: #eee; padding: 3px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>This is the Catch-All Page</h1>
    <p>No matter what path you requested, you are seeing this page.</p>
    <p>The requested URI was: <code>{{.Req.RequestURI}}</code></p>
</body>
</html>
