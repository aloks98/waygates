# =============================================================================
# Waygates Docker Compose Configuration
# =============================================================================
# This runs Waygates with a combined Backend+Caddy container and PostgreSQL.
#
# Services:
#   - waygates: Combined backend API + Caddy reverse proxy
#   - postgres: PostgreSQL database
#
# Ports:
#   - 80:   HTTP (redirects to HTTPS)
#   - 443:  HTTPS (proxy traffic)
#   - 8080: Backend API + UI
#
# L4 Proxy Ports:
#   L4 (TCP/UDP) proxies use custom ports. Add them to the waygates service
#   ports section as needed, e.g.:
#     - "25565:25565"      # Minecraft TCP
#     - "53:53/udp"        # DNS UDP
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: waygates-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-waygates}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-waygates}"]
      interval: 5s
      timeout: 5s
      retries: 5

  waygates:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Stamped into the binary; `make build` exports VERSION from git describe.
        VERSION: ${VERSION:-dev}
    container_name: waygates
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Database - override .env for Docker networking
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-waygates}
      # UI settings
      - UI_ENABLED=true
      - UI_PATH=/app/ui
      # Caddy JSON configuration
      - CADDY_BASE_PATH=/etc/caddy
      - CADDY_BINARY=/usr/bin/caddy
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-etc:/etc/caddy
      - caddy-logs:/var/log/caddy
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  caddy-etc:
  caddy-logs:
