name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/aloks98/waygates

jobs:
  build:
    runs-on: docker
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: derive version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # docker/* actions are not mirrored on this instance; set up multi-arch
      # builds with the docker CLI directly (needs a privileged docker runner).
      - name: set up QEMU
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: set up buildx
        run: |
          docker buildx create --name waygates-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: login to ghcr
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u aloks98 --password-stdin

      # Replicates docker/metadata-action's tag scheme: always tag the exact
      # version; for stable (non-prerelease) tags also tag major.minor + latest.
      - name: build & push (multi-arch)
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAGS="-t $IMAGE:$VERSION"
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "prerelease ($GITHUB_REF_NAME) -> tagging $VERSION only"
              ;;
            *)
              MM="$(printf '%s' "$VERSION" | grep -Eo '^[0-9]+\.[0-9]+' || true)"
              [ -n "$MM" ] && TAGS="$TAGS -t $IMAGE:$MM"
              TAGS="$TAGS -t $IMAGE:latest"
              ;;
          esac
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            $TAGS \
            --label "org.opencontainers.image.source=https://git.nexus.e412.in/aloks98/waygates" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --provenance=false \
            --push \
            -f Dockerfile .

      - name: logout
        if: always()
        run: docker logout ghcr.io
