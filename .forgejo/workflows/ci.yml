name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runners are self-hosted, ephemeral, scale-to-zero pods with ZERO state
# between jobs. Pick a size with runs-on: tiny-no-docker | small | medium |
# large (the legacy `docker` alias maps to large). Because nothing persists
# across jobs, all cross-run caching goes through actions/cache — including the
# buildx layer cache below, which can't rely on a reused builder.
jobs:
  # Shell replacement for dorny/paths-filter (not mirrored on this instance):
  # diff the push/PR range and decide which downstream jobs need to run.
  changes:
    runs-on: tiny-no-docker
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ui: ${{ steps.filter.outputs.ui }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # New branch / force-push / shallow clone -> base is missing or unknown.
          # Fail safe by running everything rather than skipping checks.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "diff base unavailable -> running all jobs"
            backend=true; ui=true; docker=true
          else
            changed="$(git diff --name-only "$base" "$head")"
            echo "changed files:"
            echo "$changed"
            echo "$changed" | grep -Eq '^(backend/|go\.mod|go\.sum)' && backend=true || backend=false
            echo "$changed" | grep -Eq '^ui/' && ui=true || ui=false
            echo "$changed" | grep -Eq '^(Dockerfile|docker-compose\.yml|docker/|conf/)' && docker=true || docker=false
          fi

          {
            echo "backend=$backend"
            echo "ui=$ui"
            echo "docker=$docker"
          } >> "$GITHUB_OUTPUT"
          echo "results: backend=$backend ui=$ui docker=$docker"

  lint-backend:
    runs-on: medium
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 10
    env:
      GOLANGCI_LINT_VERSION: v2.12.2
    steps:
      - uses: actions/checkout@v4

      # cache: true (the default) caches the Go module + build cache, keyed on
      # the repo-root go.sum, so deps aren't re-downloaded/recompiled each run.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      # golangci-lint-action is not mirrored on this instance; install the v2
      # binary with the Go toolchain (.golangci.yml is `version: "2"`).
      # Pinned (not @latest) so a new release can't change lint results in CI.
      # Cache the compiled binary so `go install` (which builds the linter from
      # source, ~1-2 min) only runs when the version changes.
      - name: cache golangci-lint binary
        id: cache-golangci
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}

      - name: install golangci-lint
        if: steps.cache-golangci.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: golangci-lint
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          golangci-lint run ./backend/...

  lint-ui:
    runs-on: small
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: enable pnpm
        run: corepack enable

      - name: resolve pnpm store
        id: pnpm-store
        working-directory: ui
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: lint + format check
        working-directory: ui
        run: pnpm check

  test-backend:
    runs-on: large
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 30
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      COVERDASH_SERVER: ${{ vars.COVERDASH_SERVER }}
      COVERDASH_TOKEN: ${{ secrets.COVERDASH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # cache: true (the default) caches the Go module + build cache, keyed on
      # the repo-root go.sum, so `go test` doesn't re-download/recompile deps.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      # The integration tests (api_test.go, l4_proxy_test.go) start this image
      # via testcontainers, so build it before testing. A persisted buildx
      # layer cache reuses the expensive stages (xcaddy Caddy compile, UI pnpm
      # install) across runs instead of rebuilding from scratch.
      - name: cache docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: build test image for integration tests
        run: |
          # The DinD runner exposes its daemon over TLS via env vars, which
          # buildx can't serialize into a builder node, so bind a
          # docker-container builder to an explicit docker context. If that
          # can't be set up, fall back to a plain BuildKit build (no cross-run
          # layer cache) so the pipeline still runs.
          ctx=default
          if [ -n "$DOCKER_CERT_PATH" ]; then
            docker context inspect waygates-ctx >/dev/null 2>&1 \
              || docker context create waygates-ctx \
                   --docker "host=${DOCKER_HOST},ca=${DOCKER_CERT_PATH}/ca.pem,cert=${DOCKER_CERT_PATH}/cert.pem,key=${DOCKER_CERT_PATH}/key.pem"
            ctx=waygates-ctx
          fi
          if docker buildx create --name waygates-ci --driver docker-container --use "$ctx" \
             && docker buildx inspect --bootstrap; then
            docker buildx build \
              --tag waygates-test:latest --load \
              --cache-from type=local,src=/tmp/.buildx-cache \
              --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
              .
            # Rotate the cache dir so it doesn't grow unboundedly across runs.
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true
          else
            echo "::warning::buildx docker-container setup failed; building without cross-run layer cache"
            docker buildx use default >/dev/null 2>&1 || true
            docker build -t waygates-test:latest .
          fi

      - name: run tests with coverage
        working-directory: backend
        run: go test -v -count=1 -coverprofile=coverage.txt -coverpkg=./internal/... ./...

      # Report coverage to coverdash. Skipped when COVERDASH_TOKEN is unset
      # (fork PRs / before the secret is configured) so it never fails CI.
      - name: upload coverage to coverdash
        if: ${{ env.COVERDASH_TOKEN != '' }}
        continue-on-error: true
        run: |
          # Strip the Go module path so coverdash stores repo-relative paths
          # (e.g. backend/internal/...) that its git source view can resolve.
          sed -i 's#github.com/aloks98/waygates/##g' backend/coverage.txt
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            curl -fsS -X POST "$COVERDASH_SERVER/api/v1/projects/waygates/reports" \
              -H "Authorization: Bearer $COVERDASH_TOKEN" \
              -F "format=go" \
              -F "commit=${{ github.event.pull_request.head.sha }}" \
              -F "branch=${{ github.head_ref }}" \
              -F "pr=${{ github.event.pull_request.number }}" \
              -F "base=${{ github.event.pull_request.base.sha }}" \
              -F "report=@backend/coverage.txt"
          else
            curl -fsS -X POST "$COVERDASH_SERVER/api/v1/projects/waygates/reports" \
              -H "Authorization: Bearer $COVERDASH_TOKEN" \
              -F "format=go" \
              -F "commit=${{ github.sha }}" \
              -F "branch=${{ github.ref_name }}" \
              -F "report=@backend/coverage.txt"
          fi

  build:
    runs-on: large
    needs: [changes, lint-backend, lint-ui, test-backend]
    if: |
      always() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.docker == 'true') &&
      (needs.lint-backend.result == 'success' || needs.lint-backend.result == 'skipped') &&
      (needs.lint-ui.result == 'success' || needs.lint-ui.result == 'skipped') &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Restore the layer cache (most recent prefix match) and re-export it
      # below, so this job both reuses warm layers AND seeds/refreshes the
      # cache — important because it's the only docker job that runs on
      # Dockerfile/UI-only changes (test-backend is skipped then).
      - name: cache docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: build combined image
        run: |
          # Bind a docker-container builder to an explicit context for DinD's
          # TLS daemon; fall back to a plain BuildKit build if unavailable.
          ctx=default
          if [ -n "$DOCKER_CERT_PATH" ]; then
            docker context inspect waygates-ctx >/dev/null 2>&1 \
              || docker context create waygates-ctx \
                   --docker "host=${DOCKER_HOST},ca=${DOCKER_CERT_PATH}/ca.pem,cert=${DOCKER_CERT_PATH}/cert.pem,key=${DOCKER_CERT_PATH}/key.pem"
            ctx=waygates-ctx
          fi
          if docker buildx create --name waygates-ci --driver docker-container --use "$ctx" \
             && docker buildx inspect --bootstrap; then
            docker buildx build \
              --cache-from type=local,src=/tmp/.buildx-cache \
              --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
              -f Dockerfile .
            # Rotate the cache dir so it doesn't grow unboundedly across runs.
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true
          else
            echo "::warning::buildx docker-container setup failed; building without layer cache"
            docker buildx use default >/dev/null 2>&1 || true
            docker build -f Dockerfile .
          fi
