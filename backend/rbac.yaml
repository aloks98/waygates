version: 1

permission_groups:
  - name: "Proxies"
    permissions:
      - key: "proxies:read"
        name: "View Proxies"
        description: "View proxy configurations"
      - key: "proxies:create"
        name: "Create Proxies"
        description: "Create new proxy configurations"
      - key: "proxies:update"
        name: "Update Proxies"
        description: "Modify existing proxy configurations"
      - key: "proxies:delete"
        name: "Delete Proxies"
        description: "Remove proxy configurations"

  - name: "Users"
    permissions:
      - key: "users:read"
        name: "View Users"
        description: "View user accounts"
      - key: "users:manage"
        name: "Manage Users"
        description: "Create, update, and delete user accounts"

  - name: "Settings"
    permissions:
      - key: "settings:read"
        name: "View Settings"
        description: "View application settings"
      - key: "settings:write"
        name: "Modify Settings"
        description: "Modify application settings"

  - name: "Sync"
    permissions:
      - key: "sync:read"
        name: "View Sync Status"
        description: "View synchronization status"
      - key: "sync:trigger"
        name: "Trigger Sync"
        description: "Manually trigger synchronization"

  - name: "System"
    permissions:
      - key: "system:status"
        name: "View System Status"
        description: "View system health and status"

  - name: "Audit"
    permissions:
      - key: "audit_logs:read"
        name: "View Audit Logs"
        description: "View audit log entries"

role_templates:
  - key: "admin"
    name: "Administrator"
    description: "Full access to all features"
    permissions:
      - "*"

  - key: "operator"
    name: "Operator"
    description: "Manage proxy configurations and settings"
    permissions:
      - "proxies:*"
      - "settings:read"
      - "settings:write"
      - "sync:read"
      - "sync:trigger"
      - "system:status"
      - "audit_logs:read"

  - key: "viewer"
    name: "Viewer"
    description: "Read-only access"
    permissions:
      - "proxies:read"
      - "settings:read"
      - "sync:read"
      - "system:status"
