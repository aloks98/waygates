name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ui: ${{ steps.filter.outputs.ui }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'go.mod'
              - 'go.sum'
            ui:
              - 'ui/**'
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'docker/**'
              - 'conf/**'

  lint-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend

  lint-ui:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui

      - name: Lint UI
        run: pnpm check
        working-directory: ui

  test-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: docker/setup-buildx-action@v3

      - name: Build test image for integration tests
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: waygates-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests with coverage
        run: go test -v -count=1 -coverprofile=coverage.txt -coverpkg=./internal/... ./...
        working-directory: backend

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.txt
          flags: backend
          fail_ci_if_error: false
          verbose: true

  build:
    runs-on: ubuntu-latest
    needs: [changes, lint-backend, lint-ui, test-backend]
    if: |
      always() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.docker == 'true') &&
      (needs.lint-backend.result == 'success' || needs.lint-backend.result == 'skipped') &&
      (needs.lint-ui.result == 'success' || needs.lint-ui.result == 'skipped') &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build combined image
        run: docker build -f Dockerfile .
